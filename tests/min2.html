<!DOCTYPE html><html><body><canvas id="c" width="256" height="256"></canvas>
<script type="module">
import * as THREE from 'three';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), preserveDrawingBuffer: true });
const s = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55, 1, 0.1, 5000); cam.position.set(0, 100, 0.1); cam.lookAt(0,0,0);
const g = new THREE.PlaneGeometry(400, 400, 64, 64); g.rotateX(-Math.PI/2);
const m = new THREE.ShaderMaterial({
  vertexShader: `
    varying float vH;
    void main() {
      vec3 p = position;
      p.y += 10.0 * sin(p.x * 0.1);
      vH = p.y;
      gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: `
    varying float vH;
    void main() { gl_FragColor = vec4(vH * 0.05 + 0.5, 0.3, 0.3, 1.0); }`,
});
s.add(new THREE.Mesh(g, m));
r.render(s, cam);
window.__listo = true;
</script></body></html>
